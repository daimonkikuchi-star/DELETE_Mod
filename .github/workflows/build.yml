name: Build MOD JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Java 21 をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle に実行権限を付与
        run: chmod +x gradlew

      - name: MOD をビルド
        run: ./gradlew build

      - name: ✅ JARファイルをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: delete-mod-jar
          path: build/libs/*.jar
          retention-days: 30
